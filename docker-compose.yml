x-php: &php
  build:
    context: .
    dockerfile: docker/php.Dockerfile
  image: capricciosa-php:8.3
  restart: unless-stopped
  init: true
  user: "${HOST_USER_UID:-1000}:${HOST_USER_GID:-1000}"
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: mariadb
    DB_HOST: database
    DB_PORT: "3306"
    DB_DATABASE: "${DATABASE_NAME:?Set DATABASE_NAME}"
    DB_USERNAME: "${DATABASE_USER:?Set DATABASE_USER}"
    DB_PASSWORD: "${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}"
    DB_URL: ""
    DB_SOCKET: ""
    NGINX_PHP_PM_MAX_CHILDREN: "${NGINX_PHP_PM_MAX_CHILDREN:-2}"
  volumes:
    - ./src:/var/www/app
  depends_on:
    database:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_SITE: "${CADDY_SITE:?Set CADDY_SITE to the site domain}"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./src/public:/var/www/app/public:ro
      - ./src/storage/app/public:/var/www/app/storage/app/public:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m

  app:
    <<: *php
    mem_limit: 640m
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  scheduler:
    <<: *php
    command: [php, -d, memory_limit=96M, artisan, schedule:work]
    mem_limit: 128m

  database:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${DATABASE_ROOT_PASSWORD:?Set DATABASE_ROOT_PASSWORD}"
      MARIADB_USER: "${DATABASE_USER:?Set DATABASE_USER}"
      MARIADB_PASSWORD: "${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}"
      MARIADB_DATABASE: "${DATABASE_NAME:?Set DATABASE_NAME}"
    command: [--innodb-buffer-pool-size=128M]
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 512m

  frontend:
    image: oven/bun:1
    profiles: [tools]
    user: "${HOST_USER_UID:-1000}:${HOST_USER_GID:-1000}"
    working_dir: /var/www/app
    environment:
      BUN_INSTALL_CACHE_DIR: /tmp/bun-cache
    volumes:
      - ./src:/var/www/app
    command: sh -c "bun install --frozen-lockfile && bun run --bun build"
    mem_limit: 1280m

networks:
  default:
    name: "vpc_${CONTAINER_NAME:-capricciosa}"

volumes:
  database:
  caddy_data:
  caddy_config:
