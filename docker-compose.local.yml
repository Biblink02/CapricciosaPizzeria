services:
  caddy:
    extends:
      file: docker-compose.yml
      service: caddy
    environment:
      CADDY_SITE: :80
    ports: !override
      - "127.0.0.1:8100:80"

  app:
    extends:
      file: docker-compose.yml
      service: app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  scheduler:
    extends:
      file: docker-compose.yml
      service: scheduler
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  database:
    extends:
      file: docker-compose.yml
      service: database
    ports:
      - "127.0.0.1:${DATABASE_BIND_PORT:-3306}:3306"

  frontend:
    extends:
      file: docker-compose.yml
      service: frontend
    profiles: !reset []
    ports:
      - "127.0.0.1:3100:3100"
    command: sh -c "bun install --frozen-lockfile && bun run --bun dev"

networks:
  default:
    name: "vpc_${CONTAINER_NAME:-capricciosa}"

volumes:
  database:
  caddy_data:
  caddy_config:
